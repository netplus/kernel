name: boot-crash B06 checker self-test

on:
  workflow_dispatch:

permissions:
  contents: read

# The upstream checkout uses a fixed workspace-relative directory and the
# evidence is intended to describe one exact validation run. Serialize manual
# B06 validations instead of allowing overlapping runs to race on a persistent
# self-hosted runner/workspace. Do not cancel an in-flight evidence-producing
# run when another manual dispatch is queued.
concurrency:
  group: boot-crash-b06-selftest
  cancel-in-progress: false

jobs:
  selftest:
    # This repository currently has no budget reserved for GitHub-hosted
    # runners. Keep this workflow opt-in and require a project-controlled
    # self-hosted Linux/x86-64 runner instead of silently consuming hosted
    # runner minutes.
    runs-on: [self-hosted, linux, x64, kernel-course]
    timeout-minutes: 30
    steps:
      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v git
          command -v python3
          command -v uname

          os="$(uname -s)"
          arch="$(uname -m)"
          printf 'runner platform=%s/%s\n' "$os" "$arch"
          test "$os" = Linux
          case "$arch" in
            x86_64|amd64) ;;
            *)
              printf 'B06 workflow requires an x86-64 runner; got %s\n' "$arch" >&2
              exit 1
              ;;
          esac

          git --version
          python3 --version
          # actions/checkout v4 falls back to the GitHub REST API when Git
          # 2.18+ is unavailable. B06 provenance gates require a real .git
          # repository (rev-parse/status/hash-object), so fail early instead
          # of allowing that fallback to produce a later, misleading error.
          # verify_source_contract.py also uses PEP 585 built-in generic
          # syntax such as list[tuple[str, str]], which requires Python >= 3.9.
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          git_text = subprocess.check_output(
              ["git", "--version"], text=True
          ).strip()
          match = re.search(r"git version (\d+)\.(\d+)", git_text)
          if not match:
              raise SystemExit(f"cannot parse Git version: {git_text!r}")
          git_version = tuple(map(int, match.groups()))
          if git_version < (2, 18):
              raise SystemExit(
                  f"B06 workflow requires Git >= 2.18; runner provides {git_text}"
              )

          required_python = (3, 9)
          print(f"python executable={sys.executable}")
          print(f"python version={sys.version.split()[0]}")
          if sys.version_info < required_python:
              raise SystemExit(
                  f"B06 checker requires Python >= {required_python[0]}.{required_python[1]}; "
                  f"runner provides {sys.version.split()[0]}"
              )
          PY

      # Pin third-party actions by full commit SHA so a future movement of a
      # mutable major-version tag cannot change the executable used to produce
      # B06 completion evidence. This SHA is actions/checkout v4.4.0.
      - name: Checkout course repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # workflow_dispatch selects one exact course revision. Pass it to
          # checkout explicitly instead of relying on checkout's event-default
          # ref resolution; the next step independently verifies HEAD == GITHUB_SHA.
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false

      - name: Record and verify course test provenance
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

          # workflow_dispatch establishes GITHUB_SHA as the commit selected for
          # this run. Bind the checked-out repository to that event identity so
          # the evidence cannot silently describe a different default-branch
          # revision if checkout/ref behavior changes later.
          course_head="$(git rev-parse HEAD)"
          printf 'event GITHUB_SHA=%s\n' "$GITHUB_SHA"
          git show -s --format='course HEAD=%H %s' HEAD
          test "$course_head" = "$GITHUB_SHA"

          checker=boot-crash/labs/06-kexec-lifecycle/verify_source_contract.py
          fixture=boot-crash/labs/06-kexec-lifecycle/test_verify_source_contract.py
          expected_checker_blob=5c89b67628cf55560089656d5b65e80ff74c556f
          expected_fixture_blob=f18918cfbe0b01ffba59be3ac083a9971295a2f8

          checker_committed="$(git rev-parse "HEAD:${checker}")"
          checker_worktree="$(git hash-object "$checker")"
          fixture_committed="$(git rev-parse "HEAD:${fixture}")"
          fixture_worktree="$(git hash-object "$fixture")"

          printf 'checker expected blob=%s\n' "$expected_checker_blob"
          printf 'checker committed blob=%s\n' "$checker_committed"
          printf 'checker worktree blob=%s\n' "$checker_worktree"
          printf 'fixture expected blob=%s\n' "$expected_fixture_blob"
          printf 'fixture committed blob=%s\n' "$fixture_committed"
          printf 'fixture worktree blob=%s\n' "$fixture_worktree"

          test "$checker_committed" = "$expected_checker_blob"
          test "$fixture_committed" = "$expected_fixture_blob"
          test "$checker_worktree" = "$checker_committed"
          test "$fixture_worktree" = "$fixture_committed"
          python3 --version

      - name: Run exact committed B06 fixture suite
        working-directory: boot-crash/labs/06-kexec-lifecycle
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          python3 -m unittest -v test_verify_source_contract.py 2>&1 | tee "$output"
          grep -Eq '^Ran 22 tests in ' "$output"
          grep -Eq '^OK$' "$output"

      - name: Prepare isolated upstream workspace
        shell: bash
        run: |
          set -euo pipefail
          upstream_rel=.b06-upstream-linux-v5.10
          upstream_dir="${GITHUB_WORKSPACE}/${upstream_rel}"
          rm -rf -- "$upstream_dir"
          printf 'B06_UPSTREAM_DIR=%s\n' "$upstream_dir" >> "$GITHUB_ENV"

      - name: Checkout upstream Linux v5.10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: torvalds/linux
          ref: 2c85ebc57b3e1817b6ce1a6b703928e113a90442
          path: .b06-upstream-linux-v5.10
          fetch-depth: 1
          clean: true
          persist-credentials: false
          set-safe-directory: false

      - name: Verify upstream checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$B06_UPSTREAM_DIR" rev-parse HEAD)" = "2c85ebc57b3e1817b6ce1a6b703928e113a90442"
          test -z "$(git -C "$B06_UPSTREAM_DIR" status --porcelain)"
          git -C "$B06_UPSTREAM_DIR" show -s --format='upstream HEAD=%H %s' HEAD

      - name: Verify upstream Linux v5.10 source contracts
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          python3 boot-crash/labs/06-kexec-lifecycle/verify_source_contract.py "$B06_UPSTREAM_DIR" 2>&1 | tee "$output"

          test "$(grep -Ec '^PASS [1-7]: ' "$output")" -eq 7
          for group in 1 2 3 4 5 6 7; do
            grep -Eq "^PASS ${group}: " "$output"
          done
          grep -Fxq 'PASS: 7 B06 Linux v5.10 source-contract groups' "$output"

      - name: Clean isolated upstream checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${B06_UPSTREAM_DIR:-}" && -e "$B06_UPSTREAM_DIR" ]]; then
            rm -rf -- "$B06_UPSTREAM_DIR"
          fi
          [[ -z "${B06_UPSTREAM_DIR:-}" || ! -e "$B06_UPSTREAM_DIR" ]]

      - name: Verify course checkout remained clean
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

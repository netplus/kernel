name: boot-crash B06 checker self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    # This repository currently has no budget reserved for GitHub-hosted
    # runners. Keep this workflow opt-in and require a project-controlled
    # self-hosted Linux/x86-64 runner instead of silently consuming hosted
    # runner minutes.
    runs-on: [self-hosted, linux, x64, kernel-course]
    timeout-minutes: 30
    steps:
      - name: Checkout course repository
        uses: actions/checkout@v4
        with:
          # A persistent self-hosted runner reuses its workspace. Require the
          # course checkout to discard tracked edits and untracked files left
          # by an earlier run before the exact committed fixture is executed.
          clean: true
          fetch-depth: 1
          # The job only reads repositories. Do not leave the temporary
          # GITHUB_TOKEN credential in local git config on a persistent runner.
          persist-credentials: false

      # A PASS is useful only if it can be tied back to the exact course
      # revision and checker/fixture bytes that produced it. Record those
      # identities before running either validation layer.
      - name: Record course test provenance
        run: |
          test -z "$(git status --porcelain)"
          git show -s --format='course HEAD=%H %s' HEAD
          printf 'checker blob='
          git hash-object boot-crash/labs/06-kexec-lifecycle/verify_source_contract.py
          printf 'fixture blob='
          git hash-object boot-crash/labs/06-kexec-lifecycle/test_verify_source_contract.py
          python3 --version

      - name: Run exact committed B06 fixture suite
        working-directory: boot-crash/labs/06-kexec-lifecycle
        run: python3 -m unittest -v test_verify_source_contract.py

      # B06 treats upstream Linux v5.10 as the final implementation fact
      # baseline. Pin the checkout to the exact commit behind the v5.10 tag,
      # rather than relying only on a movable ref name in the execution log.
      - name: Checkout upstream Linux v5.10
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: 2c85ebc57b3e1817b6ce1a6b703928e113a90442
          path: linux-v5.10
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify upstream checkout identity
        working-directory: linux-v5.10
        run: |
          test "$(git rev-parse HEAD)" = "2c85ebc57b3e1817b6ce1a6b703928e113a90442"
          test -z "$(git status --porcelain)"
          git show -s --format='upstream HEAD=%H %s' HEAD

      - name: Verify upstream Linux v5.10 source contracts
        run: python3 boot-crash/labs/06-kexec-lifecycle/verify_source_contract.py linux-v5.10

      # A persistent self-hosted runner reuses its work directory. The Linux
      # checkout is large and must not be left behind after either success or
      # failure; otherwise repeated course runs accumulate disk usage and can
      # make later validation fail for infrastructure rather than source
      # reasons. `always()` makes cleanup run after a failed checker as well.
      - name: Clean upstream checkout from persistent runner
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d linux-v5.10 ]]; then
            rm -rf -- linux-v5.10
          fi
          test ! -e linux-v5.10

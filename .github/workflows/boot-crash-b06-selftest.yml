name: boot-crash B06 checker self-test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-crash-b06-selftest
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: [self-hosted, linux, x64, kernel-course]
    timeout-minutes: 30
    env:
      LC_ALL: C
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for command in git python3 uname grep tee mktemp rm; do
            command -v "$command"
          done
          os="$(uname -s)"
          arch="$(uname -m)"
          printf 'runner platform=%s/%s\n' "$os" "$arch"
          test "$os" = Linux
          case "$arch" in
            x86_64|amd64) ;;
            *) printf 'B06 workflow requires an x86-64 runner; got %s\n' "$arch" >&2; exit 1 ;;
          esac
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" = / || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* ]]; then
            printf 'B06 workflow requires RUNNER_TEMP to name a non-root existing absolute non-symlink directory without CR/LF; got %q\n' "${RUNNER_TEMP:-}" >&2
            exit 1
          fi
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]; then
            printf 'B06 workflow requires positive numeric GITHUB_RUN_ID/GITHUB_RUN_ATTEMPT; got run=%q attempt=%q\n' "${GITHUB_RUN_ID:-}" "${GITHUB_RUN_ATTEMPT:-}" >&2
            exit 1
          fi
          printf 'runner temp=%s\n' "$RUNNER_TEMP"
          printf 'run identity=%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git --version
          python3 --version
          python3 - <<'PY'
          import re, subprocess, sys
          git_text = subprocess.check_output(["git", "--version"], text=True).strip()
          match = re.search(r"git version (\d+)\.(\d+)", git_text)
          if not match:
              raise SystemExit(f"cannot parse Git version: {git_text!r}")
          if tuple(map(int, match.groups())) < (2, 18):
              raise SystemExit(f"B06 workflow requires Git >= 2.18; runner provides {git_text}")
          print(f"python executable={sys.executable}")
          print(f"python version={sys.version.split()[0]}")
          if sys.version_info < (3, 9):
              raise SystemExit(f"B06 checker requires Python >= 3.9; runner provides {sys.version.split()[0]}")
          PY

      - name: Prepare isolated upstream workspace
        shell: bash
        run: |
          set -euo pipefail
          expected_upstream_dir="${RUNNER_TEMP}/kernel-course-b06-linux-v5.10-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          upstream_dir="$expected_upstream_dir"
          rm -rf -- "$upstream_dir"
          printf 'B06_UPSTREAM_DIR=%s\n' "$upstream_dir" >> "$GITHUB_ENV"

      - name: Checkout course repository
        id: course_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false

      - name: Record and verify course test provenance
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          course_head="$(git rev-parse HEAD)"
          printf 'event GITHUB_SHA=%s\n' "$GITHUB_SHA"
          git show -s --format='course HEAD=%H %s' HEAD
          test "$course_head" = "$GITHUB_SHA"
          checker=boot-crash/labs/06-kexec-lifecycle/verify_source_contract.py
          fixture=boot-crash/labs/06-kexec-lifecycle/test_verify_source_contract.py
          expected_checker_blob=5c89b67628cf55560089656d5b65e80ff74c556f
          expected_fixture_blob=f18918cfbe0b01ffba59be3ac083a9971295a2f8
          checker_committed="$(git rev-parse "HEAD:${checker}")"
          checker_worktree="$(git hash-object "$checker")"
          fixture_committed="$(git rev-parse "HEAD:${fixture}")"
          fixture_worktree="$(git hash-object "$fixture")"
          printf 'checker expected blob=%s\n' "$expected_checker_blob"
          printf 'checker committed blob=%s\n' "$checker_committed"
          printf 'checker worktree blob=%s\n' "$checker_worktree"
          printf 'fixture expected blob=%s\n' "$expected_fixture_blob"
          printf 'fixture committed blob=%s\n' "$fixture_committed"
          printf 'fixture worktree blob=%s\n' "$fixture_worktree"
          test "$checker_committed" = "$expected_checker_blob"
          test "$fixture_committed" = "$expected_fixture_blob"
          test "$checker_worktree" = "$checker_committed"
          test "$fixture_worktree" = "$fixture_committed"
          python3 --version

      - name: Run exact committed B06 fixture suite
        working-directory: boot-crash/labs/06-kexec-lifecycle
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          python3 -m unittest -v test_verify_source_contract.py 2>&1 | tee "$output"
          grep -Eq '^Ran 22 tests in ' "$output"
          grep -Eq '^OK$' "$output"

      - name: Materialize exact upstream Linux v5.10 in runner temp
        shell: bash
        run: |
          set -euo pipefail
          expected_upstream=2c85ebc57b3e1817b6ce1a6b703928e113a90442
          git init "$B06_UPSTREAM_DIR"
          git -C "$B06_UPSTREAM_DIR" remote add origin https://github.com/torvalds/linux.git
          git -C "$B06_UPSTREAM_DIR" fetch --depth=1 origin "$expected_upstream"
          git -C "$B06_UPSTREAM_DIR" checkout --detach FETCH_HEAD

      - name: Verify upstream checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$B06_UPSTREAM_DIR" rev-parse HEAD)" = "2c85ebc57b3e1817b6ce1a6b703928e113a90442"
          test -z "$(git -C "$B06_UPSTREAM_DIR" status --porcelain)"
          git -C "$B06_UPSTREAM_DIR" show -s --format='upstream HEAD=%H %s' HEAD

      - name: Verify upstream Linux v5.10 source contracts
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          python3 boot-crash/labs/06-kexec-lifecycle/verify_source_contract.py "$B06_UPSTREAM_DIR" 2>&1 | tee "$output"
          test "$(grep -Ec '^PASS [1-7]: ' "$output")" -eq 7
          for group in 1 2 3 4 5 6 7; do
            grep -Eq "^PASS ${group}: " "$output"
          done
          grep -Fxq 'PASS: 7 B06 Linux v5.10 source-contract groups' "$output"
          test "$(git -C "$B06_UPSTREAM_DIR" rev-parse HEAD)" = "2c85ebc57b3e1817b6ce1a6b703928e113a90442"
          test -z "$(git -C "$B06_UPSTREAM_DIR" status --porcelain)"

      - name: Clean isolated upstream checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          # This step runs even when the prerequisite step failed. Revalidate the
          # destructive-cleanup root and run identity here instead of relying on
          # an earlier gate.
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" = / || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* ]]; then
            printf 'refusing B06 cleanup because RUNNER_TEMP is not a non-root existing absolute non-symlink directory without CR/LF: %q\n' "${RUNNER_TEMP:-}" >&2
            exit 1
          fi
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]; then
            printf 'refusing B06 cleanup because run identity is invalid: run=%q attempt=%q\n' "${GITHUB_RUN_ID:-}" "${GITHUB_RUN_ATTEMPT:-}" >&2
            exit 1
          fi
          expected_upstream_dir="${RUNNER_TEMP}/kernel-course-b06-linux-v5.10-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          upstream_dir="${B06_UPSTREAM_DIR:-$expected_upstream_dir}"
          if [[ "$upstream_dir" != "$expected_upstream_dir" ]]; then
            printf 'refusing unexpected B06 cleanup path: %q (expected %q)\n' "$upstream_dir" "$expected_upstream_dir" >&2
            exit 1
          fi
          if [[ -e "$upstream_dir" || -L "$upstream_dir" ]]; then
            rm -rf -- "$upstream_dir"
          fi
          [[ ! -e "$upstream_dir" && ! -L "$upstream_dir" ]]

      - name: Verify course checkout remained exact and clean
        if: ${{ always() && steps.course_checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
